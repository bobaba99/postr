name: ci

# Run on every push and pull request. Keeps the matrix tiny — one
# Node version — because builds are fast enough that slicing across
# versions isn't worth the cache churn yet. Bump to a matrix when we
# start pinning engines in package.json.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel stale runs on the same ref so a force-push doesn't leave
# ghost builds burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dummy Supabase + API env vars so the browser Supabase client in
    # apps/web/src/lib/supabase.ts doesn't throw at module load time
    # during the test suite. The client is never actually called in
    # tests (Supabase is mocked per-test where needed), but the module
    # fails fast on missing env, which breaks test file discovery.
    # These values are NOT secrets — the publishable key is safe to
    # expose by design, and the URL is a placeholder that never gets
    # hit during CI test runs.
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      VITE_API_BASE_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm -w @postr/shared run build --if-present

      - name: Typecheck web
        run: npm -w @postr/web run build

      - name: Test web
        run: npm -w @postr/web run test

  api:
    name: api (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm -w @postr/shared run build --if-present

      - name: Build API
        run: npm -w @postr/api run build

  db:
    name: db (migrations + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Boots the Supabase Postgres container from scratch — which applies
    # every migration in supabase/migrations/ — then runs the pgTAP suite
    # in supabase/tests/. This is the only job that executes the SQL RPCs
    # for real: PL/pgSQL bodies are just syntax-checked at CREATE time, so
    # a broken column reference inside a function applies cleanly and only
    # fails at runtime (see 20260610000000_fix_gdpr_export_feedback_columns).
    #
    # No secrets here by design: the throwaway container uses the Supabase
    # CLI's well-known local-stack defaults. Real credentials must never
    # appear in CI. The GOOGLE_CLIENT_ID/SECRET warnings from config.toml
    # are expected — the auth service isn't started, Postgres alone is.
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the suite was developed against; `db start`
      # behavior (auto-applying migrations) is what the job relies on.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Start local Postgres (applies all migrations)
        run: supabase db start

      - name: Run SQL tests
        run: supabase test db
